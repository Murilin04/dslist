<div class="container">
  <ul>
    <li *ngFor="let game of games">
        <div class="game-item">
          <img src="{{ game.imgUrl }}" alt="{{ game.title }}" />

          <div class="game-details">
            <span class="year">{{ game.year }}</span>
            <h2>{{ game.title }}</h2>
            <p><strong>Genre:</strong> {{ game.genre }}</p>
            <p><strong>Platforms:</strong> {{ game.platforms }}</p>

            <div class="stars">
              <ng-container *ngFor="let star of getStars(game.score)">
                <mat-icon *ngIf="star === 'completa'">star</mat-icon>
                <mat-icon *ngIf="star === 'metade'">star_half</mat-icon>
                <mat-icon *ngIf="star === 'vazia'">star_border</mat-icon>
              </ng-container>
            </div>
          </div>

        </div>

        <div class="game-info">
          <span class="desc">{{ game.longDescription }}</span>
        </div>
    </li>
  </ul>
</div>
